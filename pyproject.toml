[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-detection-ml"
version = "0.1.0"
description = "Leakage-safe market regime model comparison with a Statistical Jump Model implemented from scratch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
market-data = ["yfinance>=0.2.40", "pandas-datareader>=0.10"]
models = ["hmmlearn>=0.3", "xgboost>=2.0"]
plots = ["matplotlib>=3.7", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.5"]
all = [
  "yfinance>=0.2.40", "pandas-datareader>=0.10", "hmmlearn>=0.3",
  "xgboost>=2.0", "matplotlib>=3.7", "seaborn>=0.13", "pytest>=8", "ruff>=0.5"
]

[project.scripts]
regime-research = "market_regime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

